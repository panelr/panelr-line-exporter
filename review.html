<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Panelr — Review Export</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #0f1117;
      color: #e2e8f0;
    }
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      background: #1a1d2e;
      border-bottom: 1px solid #2d3147;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .logo { font-weight: 700; font-size: 15px; color: #fff; }
    .logo span { color: #f59e0b; }
    .header-title { color: #94a3b8; font-size: 13px; }
    .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

    .toolbar {
      background: #13161f;
      border-bottom: 1px solid #2d3147;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .summary {
      display: flex;
      gap: 20px;
      margin-right: 16px;
    }
    .summary-item .val { font-size: 17px; font-weight: 700; color: #f59e0b; }
    .summary-item .lbl { font-size: 10px; color: #64748b; text-transform: uppercase; }

    .divider { width: 1px; height: 24px; background: #2d3147; margin: 0 4px; }

    .table-container {
      flex: 1;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    thead th {
      background: #1a1d2e;
      padding: 9px 12px;
      text-align: left;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #64748b;
      position: sticky;
      top: 0;
      border-bottom: 1px solid #2d3147;
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #1e2235; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #141720; }
    tbody td {
      padding: 6px 12px;
      color: #cbd5e1;
      vertical-align: middle;
    }
    tbody td input, tbody td select {
      background: #1a1d2e;
      border: 1px solid #2d3147;
      color: #e2e8f0;
      padding: 4px 7px;
      border-radius: 5px;
      font-size: 12px;
      width: 100%;
      outline: none;
    }
    tbody td input:focus, tbody td select:focus { border-color: #f59e0b; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 700;
    }
    .badge-active  { background: #064e3b; color: #34d399; }
    .badge-expired { background: #450a0a; color: #f87171; }
    .badge-disabled{ background: #1e293b; color: #64748b; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary  { background: #f59e0b; color: #0f1117; }
    .btn-secondary{ background: #2d3147; color: #e2e8f0; }
    .btn-danger   { background: #7f1d1d; color: #fca5a5; }
    .btn-success  { background: #10b981; color: #fff; }

    label.toolbar-label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      white-space: nowrap;
    }
    select.toolbar-select {
      background: #1a1d2e;
      border: 1px solid #2d3147;
      color: #e2e8f0;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
      min-width: 180px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #475569;
    }
    .empty-state i { font-size: 2.5rem; display: block; margin-bottom: 12px; opacity: 0.3; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="header">
      <div class="logo">panel<span>r</span></div>
      <span class="header-title">Review Line Export</span>
      <div class="header-right">
        <button class="btn btn-success" id="btn-export">⬇ Download CSV</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="summary" id="summary-bar"></div>

      <div class="divider"></div>

      <button class="btn btn-danger" id="btn-skip-expired">✕ Remove Expired</button>

      <div class="divider"></div>

      <label class="toolbar-label">Bulk Assign Product:</label>
      <select class="toolbar-select" id="bulk-product-select"></select>
      <button class="btn btn-secondary" id="btn-bulk-all">Apply to All</button>
      <button class="btn btn-secondary" id="btn-bulk-active">Active Only</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>User ID</th>
            <th>Username</th>
            <th>Password</th>
            <th>Expires</th>
            <th>Status</th>
            <th>Customer Name</th>
            <th>Email</th>
            <th>Notes</th>
            <th>Product</th>
          </tr>
        </thead>
        <tbody id="review-tbody"></tbody>
      </table>
    </div>
  </div>

  <script src="panels.js"></script>
  <script src="review.js"></script>
</body>
</html>
